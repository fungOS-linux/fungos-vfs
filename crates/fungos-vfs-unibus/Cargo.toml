[package]
name = "fungos-vfs-unibus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Unibus content hydrator for fungos-vfs"
repository = "https://github.com/fungOS-linux/fungos-vfs"

[dependencies]
fungos-vfs = { path = "../.." }
serde = { version = "1", features = ["derive"] }
futures = "0.3"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "89f7e5eda8426c13d6e7d71a433b0d82d2c37392" }

[dev-dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
unibus-iroh = { git = "https://github.com/fungOS-linux/unibus.git", rev = "89f7e5eda8426c13d6e7d71a433b0d82d2c37392", features = ["transport"] }

[[bin]]
name = "fungos-vfs-provider"
path = "src/bin/fungos-vfs-provider.rs"
