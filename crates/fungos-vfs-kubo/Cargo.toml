[package]
name = "fungos-vfs-kubo"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Kubo/IPFS content provider for fungOS VFS"

[dependencies]
fungos-vfs = { path = "../.." }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "multipart",
    "query",
    "rustls",
] }

[[bin]]
name = "fungos-vfs-kubo-provider"
path = "src/bin/fungos-vfs-kubo-provider.rs"
